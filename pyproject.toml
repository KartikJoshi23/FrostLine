[project]
name = "frostline"
version = "0.1.0"
description = "Early warning for USDT wallets on TRON before a Tether freeze (AI in Finance, Group 2)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Data and pipeline (plan 8.1)
    "duckdb>=2.0,<3",            # fall back to 1.5.6 if a P0 test fails (plan 8.3)
    "polars>=2.0,<3",            # fall back to 1.44.2 if Pandera fails with 2.x
    "pandas>=3.0,<4",
    "pyarrow>=26,<27",           # MLflow needs PyArrow below 27
    "numpy>=2.4,<3",
    "pandera[polars]>=0.36",
    "dagster>=1.13,<1.14",
    "dagster-webserver>=1.13,<1.14",
    "dagster-duckdb>=0.29,<0.30",
    "google-cloud-bigquery>=3.40",
    "google-cloud-bigquery-storage>=2.40",
    "db-dtypes>=1.4",
    "httpx>=0.28,<0.30",
    "tenacity>=9",
    "base58>=2.1",
    # Models and analysis
    "scikit-learn>=1.9,<1.10",
    "lightgbm>=4.6,<5",
    "statsmodels>=0.14",
    "networkx>=3.6",
    "mlflow>=3.10,<4",
    "matplotlib>=3.9",
    # Serving, live service and proof
    "fastapi>=0.120",
    "uvicorn>=0.38",
    "sse-starlette>=3.0",
    "pydantic>=2.12",
    "opentimestamps-client>=0.7",
]

[project.optional-dependencies]
nn = ["torch>=2.10", "torch-geometric>=2.7"]
graph = ["networkit>=11"]
viz = ["umap-learn>=0.5", "shap>=0.48"]
ai = ["langgraph>=1.0,<2", "langchain-ollama>=1.0", "ollama>=0.6"]

[dependency-groups]
dev = [
    "pytest>=9",
    "hypothesis>=6.140",
    "ruff>=0.17,<0.18",
    "pre-commit>=4.3",
    "marimo>=0.20",
]

[tool.uv]
# Plan 8.3: install only releases at least 14 days old on the day of setup (26 Nov 2026).
exclude-newer = "2026-11-12T00:00:00Z"
default-groups = ["dev"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frostline"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
